name: Build and Deploy — Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rabotka-business

on:
  pull_request:
    branches:
      - main
    types:
      - closed

# One deploy at a time. Three PRs merged seconds apart raced each other on the
# VPS: concurrent `git fetch` in the same checkout failed with "cannot lock ref
# 'refs/remotes/origin/develop'" and two of the three deploys died.
#
# Queue rather than cancel — killing a run mid `docker compose up` can leave the
# VPS on a half-swapped container. GitHub keeps only the newest pending run, so
# a burst of merges converges on the latest commit instead of replaying each.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Deploy pre-built image from GHCR to VPS.
  # Reuses the latest image built by the develop workflow.
  # BACKEND_URL and PORT are injected at runtime via .env.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (production)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Fetch secrets from Vault
        id: vault
        run: |
          LOGIN_RESPONSE=$(curl -s --request POST \
            --data "{\"role_id\":\"${{ secrets.VAULT_ROLE_ID_PROD }}\",\"secret_id\":\"${{ secrets.VAULT_SECRET_ID_PROD }}\"}" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/approle/login")
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.auth.client_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Vault AppRole login failed. Response keys: $(echo "$LOGIN_RESPONSE" | jq -r 'keys | join(", ")')"
            echo "::error::Vault errors: $(echo "$LOGIN_RESPONSE" | jq -r '.errors // [] | join(", ")')"
            exit 1
          fi
          echo "Vault login OK, token acquired"

          SECRET_RESPONSE=$(curl -s \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/secret/data/apps/rabotka-business-production")

          SECRET_KEYS=$(echo "$SECRET_RESPONSE" | jq -r '.data.data | keys | join(", ")' 2>/dev/null || echo "none")
          echo "Secret keys found: $SECRET_KEYS"

          VAULT_SECRET=$(echo "$SECRET_RESPONSE" | jq -r '.data.data')

          BACKEND_URL=$(echo "$VAULT_SECRET" | jq -r '.BACKEND_URL')
          if [ -z "$BACKEND_URL" ] || [ "$BACKEND_URL" = "null" ]; then
            echo "::error::BACKEND_URL not found in Vault secret. Available keys: $SECRET_KEYS"
            exit 1
          fi
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

          PORT=$(echo "$VAULT_SECRET" | jq -r '.PORT')
          if [ -z "$PORT" ] || [ "$PORT" = "null" ]; then
            echo "::error::PORT not found in Vault secret. Available keys: $SECRET_KEYS"
            exit 1
          fi
          echo "port=$PORT" >> $GITHUB_OUTPUT

          curl -sf --request POST \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self" > /dev/null || true

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Runner→GHCR is reliable; this login is only used by the SSH-stream
      # fallback below (runner pulls the image, then streams it to the VPS).
      - name: Log in to GHCR (for fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on VPS (native, SSH-stream fallback)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rabotka-business:latest"
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p ${{ secrets.VPS_PORT }}"
          # Fast path: native pull on the VPS. Short 90s timeout × 3 so a
          # VPS→GHCR blackhole fails fast (~5 min) instead of hanging ~30 min.
          if ssh $SSHOPTS "$DEST" "ok=0; for i in 1 2 3; do timeout 90 docker pull '$IMAGE' && { ok=1; break; }; echo \"native pull attempt \$i stalled...\"; sleep 5; done; [ \$ok = 1 ]"; then
            echo "✅ Native pull succeeded"
          else
            # Fallback: the VPS can't pull from GHCR, but the runner can. Pull
            # here, then stream the image to the VPS over the (IPv4) SSH channel,
            # which is unaffected by the registry blackhole.
            echo "⚠️ Native pull stalled — streaming image to VPS over SSH"
            docker pull "$IMAGE"
            docker save "$IMAGE" | gzip -1 | ssh $SSHOPTS "$DEST" "gunzip | docker load"
            echo "✅ Image loaded on VPS via SSH stream"
          fi

      - name: Write .env and deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cat > ~/rabotka-business-prod/.env << 'EOF'
          BUSINESS_IMAGE=ghcr.io/${{ github.repository_owner }}/rabotka-business:latest
          APP_ENV=prod
          BUSINESS_DOMAIN=business.rabotka.work
          BACKEND_URL=${{ steps.vault.outputs.backend_url }}
          PORT=${{ steps.vault.outputs.port }}
          EOF
          sed -i 's/^[[:space:]]*//' ~/rabotka-business-prod/.env
          cd ~/rabotka-business-prod && git fetch origin main && git reset --hard origin/main && \
          docker compose -f docker-compose.prod.yml up -d --remove-orphans && \
          docker image prune -af"

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Smoke test
  # ───────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (production)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Wait for container to stabilize
        run: sleep 30

      - name: Check business app is reachable
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 20 \
              "https://business.rabotka.work")
            echo "Attempt $i — HTTP status: $STATUS"
            [[ "$STATUS" = "200" || "$STATUS" = "302" ]] && exit 0
            sleep 15
          done
          echo "Agent app did not return 200 or 302 after 3 attempts"
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Slack notification
  # Its own job, not steps inside the smoke test: a failed deploy skips
  # every later job, and notify steps living in one of them never ran — a
  # broken deploy posted nothing. always() runs this whatever happened above;
  # the merged gate keeps a PR closed without merging silent.
  # ───────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always() && github.event.pull_request.merged == true
    permissions: {}

    steps:
      - name: Collect job results
        id: result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          FAILED=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"] | join(", ")')
          if [ -z "$FAILED" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Slack notify success
        if: steps.result.outputs.ok == 'true'
        env:
          MESSAGE: |
            Deployment Succeeded (business production)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }

      - name: Slack notify failure
        if: steps.result.outputs.ok != 'true'
        env:
          MESSAGE: |
            Deployment Failed (business production)
            Failed at: ${{ steps.result.outputs.failed }}
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }
